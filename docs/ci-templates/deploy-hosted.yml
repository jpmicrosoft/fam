# deploy-hosted.yml — GitHub Actions template for Hosted agent deployment
#
# INERT TEMPLATE: Copy this file into your repository's .github/workflows/
# directory and customise the placeholder values before use.
#
# Infrastructure provisioning is explicit and OFF by default.
# Set the PROVISION input or variable to "true" to enable it.
#
# See docs/ci-templates/README.md for required variables and setup instructions.

name: "Deploy Agent (Hosted)"

on:
  push:
    branches: [main]
    paths:
      - "agents/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      provision:
        description: "Run azd provision after previewing the infrastructure changes"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-hosted-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC for Azure login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      WORKSPACE: agents/hosted-agent
      AZD_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RECEIPT_PATH: .receipts/${{ github.event.inputs.environment || 'dev' }}.json
      PROVISION: ${{ github.event.inputs.provision || 'false' }}
      INSTALLER_REPO: ${{ vars.INSTALLER_REPO || 'jpmicrosoft/fam' }}
      FAM_VERSION: ${{ vars.FAM_VERSION || 'latest' }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_AI_PROJECT_ID: ${{ vars.AZURE_AI_PROJECT_ID }}
      FOUNDRY_PROJECT_ENDPOINT: ${{ vars.FOUNDRY_PROJECT_ENDPOINT || vars.AZURE_AI_PROJECT_ENDPOINT }}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME }}
      FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_ENDPOINT: ${{ vars.FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_ENDPOINT }}
      FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_DCR_ID: ${{ vars.FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_DCR_ID }}
      FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_STREAM: ${{ vars.FOUNDRY_AGENT_MANAGER_RECEIPT_LOG_STREAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}          # Replace or set as variable
          tenant-id: ${{ vars.AZURE_TENANT_ID }}          # Replace or set as variable
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}  # Replace or set as variable

      - name: Install fam
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.FAM_INSTALL_TOKEN || github.token }}
        run: |
          if [[ "$FAM_VERSION" = "latest" ]]; then
            gh release download \
              --repo "$INSTALLER_REPO" \
              --pattern install.sh \
              --dir "$RUNNER_TEMP"
          else
            gh release download "$FAM_VERSION" \
              --repo "$INSTALLER_REPO" \
              --pattern install.sh \
              --dir "$RUNNER_TEMP"
          fi
          GITHUB_TOKEN="$GH_TOKEN" sh "${RUNNER_TEMP}/install.sh" \
            --repo "$INSTALLER_REPO" \
            --version "$FAM_VERSION" \
            --install-dir "${RUNNER_TEMP}/bin"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Install pinned Azure Developer CLI
        uses: Azure/setup-azd@v2
        with:
          version: 1.27.1

      - name: Install pinned Hosted Agent extension
        run: azd extension install azure.ai.agents --version 1.0.0-beta.13

      - name: Authenticate azd with GitHub OIDC
        run: azd auth login --federated-credential-provider github

      - name: Create the job-local azd environment
        working-directory: ${{ env.WORKSPACE }}
        run: |
          azd env new "$AZD_ENVIRONMENT" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "$AZURE_TENANT_ID"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set AZURE_AI_PROJECT_ID "$AZURE_AI_PROJECT_ID"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$FOUNDRY_PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$AZURE_AI_MODEL_DEPLOYMENT_NAME"

      - name: Prepare receipt directory
        run: mkdir -p "$(dirname "$RECEIPT_PATH")"

      - name: Validate Hosted workspace
        run: |
          fam hosted validate \
            --workspace "$WORKSPACE" \
            --output json

      - name: Plan Hosted deployment
        run: |
          fam hosted plan \
            --workspace "$WORKSPACE" \
            --environment "$AZD_ENVIRONMENT" \
            --cloud AzureCloud \
            --output json

      - name: Preflight Hosted deployment
        run: |
          fam hosted preflight \
            --workspace "$WORKSPACE" \
            --environment "$AZD_ENVIRONMENT" \
            --accept-preview \
            --cloud AzureCloud \
            --output json

      - name: Deploy (if changed)
        shell: bash
        run: |
          args=(
            hosted
            deploy
            --workspace "$WORKSPACE"
            --environment "$AZD_ENVIRONMENT"
            --accept-preview
            --cloud AzureCloud
            --receipt "$RECEIPT_PATH"
            --if-changed
            --output json
          )
          if [ "$PROVISION" = "true" ]; then
            args+=(--provision --preview-provision)
          fi
          fam "${args[@]}"

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-receipt-${{ github.event.inputs.environment || 'dev' }}
          path: ${{ env.RECEIPT_PATH }}
          retention-days: 90
          if-no-files-found: ignore
