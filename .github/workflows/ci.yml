name: CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild without moving tag history
        required: true
        type: string

concurrency:
  group: ci-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - name: Checkout source
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &validate-release-source
        name: Validate checked-out release source
        id: release-source
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be semantic versioning prefixed with v."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Requested release tag does not exist."
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$tag_commit" ]; then
            echo "::error::Checked-out source is not the requested release tag commit."
            exit 1
          fi
          historical=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$RELEASE_TAG" =~ ^v0\.([0-9]|1[0-7])\. ]]; then
            historical=true
          fi
          echo "historical=$historical" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test live-release gate classification
        shell: pwsh
        run: ./scripts/Test-LiveReleaseGateClassification.ps1

      # The race detector is unavailable on windows/arm64 developer machines, so
      # CI is the gate that runs it.
      - name: Test with the race detector
        run: go test -count=1 -race ./...

      - name: Verify tests preserve the checkout
        if: ${{ github.event_name != 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD --
          untracked="$(git ls-files --others)"
          if [ -n "$untracked" ]; then
            echo "::error::Tests left untracked files in the checkout, including ignored files."
            while IFS= read -r file; do
              printf 'Test output: %s\n' "$file"
            done <<< "$untracked"
            exit 1
          fi

      - name: Build
        run: go build -o fam ./cmd

      - name: Qualify executable contract
        shell: pwsh
        run: >
          ./scripts/Test-Release.ps1
          -SkipCoreChecks
          -SkipRace
          -SkipCrossCompile
          -OutputDirectory "${{ runner.temp }}/release-qualification"

  weekly-review-validation:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout FAM candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fam
          persist-credentials: false

      - name: Set up Node for the fixed validation runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Read the matching compiler and runtime pin
        id: runtime
        working-directory: fam
        shell: bash
        run: |
          set -euo pipefail
          pin="$(node scripts/Test-WeeklyReviewValidation.cjs pin)"
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$pin" >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned validation runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jpmicrosoft/gh-aw
          ref: ${{ steps.runtime.outputs.sha }}
          path: runtime
          persist-credentials: false

      - name: Set up the candidate Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: fam/go.mod
          cache-dependency-path: fam/go.sum

      - name: Prepare offline repository validation
        working-directory: fam
        run: |
          go mod download
          go mod verify
          GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go test -run '^$' ./...

      - name: Install the pinned runtime dependencies outside FAM
        working-directory: runtime/actions/setup/js
        run: npm ci --no-audit --no-fund

      - name: Validate the full FAM publication tree without inference
        working-directory: fam
        run: node scripts/Test-WeeklyReviewValidation.cjs validate "$GITHUB_WORKSPACE/runtime"

  update-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - name: Checkout source
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *validate-release-source

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test native self-update
        # Historical release rebuilds can predate the self-updater.
        if: ${{ hashFiles('internal/update/*.go') != '' }}
        run: go test -count=1 ./internal/update

  hosted-skills-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag) }}
          persist-credentials: false

      - name: Checkout source
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - *validate-release-source

      - name: Require runtime qualification inputs
        id: runtime-inputs
        shell: bash
        env:
          HISTORICAL_REBUILD: ${{ steps.release-source.outputs.historical }}
        run: |
          set -euo pipefail
          if [ "$HISTORICAL_REBUILD" = true ] && [ ! -e internal/skillruntime ]; then
            echo "::notice::Validated pre-0.18.0 historical release has no Skills runtime."
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for path in \
            internal/skillruntime/runtime.go \
            internal/skillruntime/templates/fam_skills_runtime.py \
            internal/skillruntime/templates/FamSkillsRuntime.cs \
            internal/skillruntime/testdata/requirements.txt \
            internal/skillruntime/testdata/python_runtime_test.py \
            examples/hosted-skills/dotnet/HostedSkills.Example.csproj \
            examples/hosted-skills/dotnet/McpRuntimeTests.cs; do
            if [ ! -s "$path" ]; then
              echo "::error::Required Skills qualification input is missing or empty: $path"
              exit 1
            fi
          done
          echo "required=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: ${{ steps.runtime-inputs.outputs.required == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up .NET
        if: ${{ steps.runtime-inputs.outputs.required == 'true' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Test real Python Skills providers
        if: ${{ steps.runtime-inputs.outputs.required == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check -r internal/skillruntime/testdata/requirements.txt
          python -B internal/skillruntime/testdata/python_runtime_test.py -v

      - name: Test built and published .NET Skills providers
        if: ${{ steps.runtime-inputs.outputs.required == 'true' }}
        run: |
          project="examples/hosted-skills/dotnet/HostedSkills.Example.csproj"
          artifacts="$RUNNER_TEMP/skills-dotnet"
          dotnet build "$project" -c Release --artifacts-path "$artifacts" --no-incremental
          dotnet "$artifacts/bin/HostedSkills.Example/release/HostedSkills.Example.dll" --self-test-require-symlinks
          dotnet publish "$project" -c Release --artifacts-path "$artifacts" --no-restore -o "$artifacts/published"
          dotnet "$artifacts/published/HostedSkills.Example.dll" --self-test-require-symlinks

      - name: Verify published Skill bytes
        if: ${{ steps.runtime-inputs.outputs.required == 'true' }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          artifacts = Path(os.environ["RUNNER_TEMP"]) / "skills-dotnet"
          built = artifacts / "bin/HostedSkills.Example/release/fam_skills"
          published = artifacts / "published/fam_skills"

          def inventory(root):
              if not root.is_dir():
                  raise RuntimeError(f"Missing output Skill bundle: {root}")
              return {
                  path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in root.rglob("*") if path.is_file()
              }

          expected = inventory(built)
          if not expected or expected != inventory(published):
              raise RuntimeError("Published Skill bundle differs from build output")
          helper = Path("internal/skillruntime/templates/FamSkillsRuntime.cs").read_bytes()
          if expected.get("FamSkillsRuntime.cs") != hashlib.sha256(helper).hexdigest():
              raise RuntimeError("Published Skills helper differs from the source template")
          print(f"Verified {len(expected)} published Skill files")
          PY

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [ci, update-native, hosted-skills-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          persist-credentials: false

      - *validate-release-source

      - name: Checkout current release tooling
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .release-tooling
          sparse-checkout: scripts/Generate-ThirdPartyNotices.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release source version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          SOURCE_VERSION="$(go run ./cmd version --output json | awk -F'"' '/"version"/ { print $4; exit }')"
          if [ -z "$SOURCE_VERSION" ]; then
            echo "::error::Could not read the source version from fam."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$SOURCE_VERSION" ]; then
            echo "::error::Release tag version ${TAG_VERSION} does not match source version ${SOURCE_VERSION}."
            exit 1
          fi

      - name: Derive version metadata
        id: meta
        run: |
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate third-party notices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $script = if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and (Test-Path '.release-tooling/scripts/Generate-ThirdPartyNotices.ps1')) {
            '.release-tooling/scripts/Generate-ThirdPartyNotices.ps1'
          } else {
            './scripts/Generate-ThirdPartyNotices.ps1'
          }
          & $script -OutputPath dist/THIRD_PARTY_NOTICES.txt -SourceRoot "$PWD"

      - name: Cross-compile binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          PKG="foundry-agent-manager/internal/config"
          LDFLAGS="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.BuildCommit=${COMMIT} -X ${PKG}.BuildDate=${DATE}"

          targets=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          cp LICENSE dist/LICENSE
          for target in "${targets[@]}"; do
            os="${target%/*}"
            arch="${target#*/}"
            bin="fam"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi

            echo "::group::Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "dist/${bin}${ext}" ./cmd
            archive="fam_${VERSION}_${os}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd dist && zip "../dist/${archive}.zip" "${bin}${ext}" LICENSE THIRD_PARTY_NOTICES.txt && rm "${bin}${ext}")
            else
              tar -czf "dist/${archive}.tar.gz" -C dist "${bin}" LICENSE THIRD_PARTY_NOTICES.txt && rm "dist/${bin}"
            fi
            echo "::endgroup::"
          done
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz *.zip install.sh install.ps1 LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Explain skipped build provenance
        if: ${{ github.event.repository.visibility != 'public' }}
        run: echo "::notice::Skipping build provenance attestation for a non-public repository; verify SHA256SUMS or build from source."

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --title "$RELEASE_TAG" \
            --generate-notes
