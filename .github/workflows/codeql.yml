name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "25 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_public: ${{ steps.visibility.outputs.is_public }}
    steps:
      - name: Determine repository visibility
        id: visibility
        run: echo "is_public=${{ github.event.repository.visibility == 'public' }}" >> "$GITHUB_OUTPUT"

  analyze:
    needs: check-visibility
    if: ${{ needs.check-visibility.outputs.is_public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  skip-private:
    needs: check-visibility
    if: ${{ needs.check-visibility.outputs.is_public != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CodeQL analysis skipped (private repository)
        run: |
          echo "::notice::CodeQL code scanning requires GitHub Advanced Security, which is unavailable while the repository is private."
          echo "::notice::Analysis will run automatically when the repository visibility is changed to public. Use workflow_dispatch to trigger manually."
