name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "25 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_public: ${{ steps.visibility.outputs.is_public }}
    steps:
      - name: Determine repository visibility
        id: visibility
        env:
          IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: echo "is_public=$IS_PUBLIC" >> "$GITHUB_OUTPUT"

  analyze:
    needs: check-visibility
    if: ${{ needs.check-visibility.outputs.is_public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, csharp]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up .NET
        if: ${{ matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'csharp' && 'manual' || matrix.language == 'python' && 'none' || 'autobuild' }}

      - name: Autobuild
        if: ${{ matrix.language == 'go' }}
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Build the .NET Skills adapter
        if: ${{ matrix.language == 'csharp' }}
        run: >
          dotnet build examples/hosted-skills/dotnet/HostedSkills.Example.csproj
          -c Release --artifacts-path "$RUNNER_TEMP/codeql-dotnet" --no-incremental

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  skip-private:
    needs: check-visibility
    if: ${{ needs.check-visibility.outputs.is_public != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CodeQL analysis skipped (private repository)
        run: |
          echo "::notice::CodeQL code scanning requires GitHub Advanced Security, which is unavailable while the repository is private."
          echo "::notice::Analysis will run automatically when the repository visibility is changed to public. Use workflow_dispatch to trigger manually."
