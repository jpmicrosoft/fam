name: Live evaluator calibration

on:
  workflow_dispatch:
    inputs:
      project_endpoint:
        description: Disposable Foundry project endpoint containing the judge model deployment
        required: true
        type: string
      model:
        description: Model deployment used by the Foundry label-model judge
        required: true
        default: gpt-5-mini
        type: string

concurrency:
  group: live-evaluator-calibration
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-evaluator-calibration
    env:
      OUTPUT_DIRECTORY: .release-qualification/evaluator-calibration/live-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/evaluator-calibration/requirements.txt

      - name: Install pinned evaluator dependencies
        run: >
          python -m pip install
          --disable-pip-version-check
          -r qa/evaluator-calibration/requirements.txt

      - name: Sign in to Azure with workload identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run live evaluator calibration
        shell: pwsh
        run: >
          ./scripts/Invoke-LiveEvaluatorCalibration.ps1
          -ProjectEndpoint "${{ inputs.project_endpoint }}"
          -Model "${{ inputs.model }}"
          -OutputDirectory "$env:OUTPUT_DIRECTORY"

      - name: Archive calibration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluator-calibration-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIRECTORY }}
          if-no-files-found: error
          retention-days: 30
