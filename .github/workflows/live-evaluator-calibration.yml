name: Live evaluator calibration

on:
  workflow_dispatch:
    inputs:
      project_endpoint:
        description: Disposable Foundry project endpoint containing the judge model deployment
        required: true
        type: string
      model:
        description: Model deployment used by the Foundry label-model judge
        required: true
        default: gpt-5-mini
        type: string

concurrency:
  group: live-evaluator-calibration
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: live-evaluator-calibration
    env:
      OUTPUT_DIRECTORY: .release-qualification/evaluator-calibration/live-ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qa/evaluator-calibration/requirements.txt

      - name: Install pinned evaluator dependencies
        run: >
          python -m pip install
          --disable-pip-version-check
          -r qa/evaluator-calibration/requirements.txt

      - name: Sign in to Azure with workload identity
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run live evaluator calibration
        shell: pwsh
        env:
          PROJECT_ENDPOINT: ${{ inputs.project_endpoint }}
          MODEL: ${{ inputs.model }}
        run: >
          ./scripts/Invoke-LiveEvaluatorCalibration.ps1
          -ProjectEndpoint "$env:PROJECT_ENDPOINT"
          -Model "$env:MODEL"
          -OutputDirectory "$env:OUTPUT_DIRECTORY"

      - name: Archive calibration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluator-calibration-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIRECTORY }}
          if-no-files-found: error
          retention-days: 30
