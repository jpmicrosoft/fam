version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    labels:
      - dependencies
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # Managed together with the pinned gh-aw compiler, not as standalone action updates.
      - dependency-name: "jpmicrosoft/gh-aw"
      - dependency-name: "jpmicrosoft/gh-aw/actions/*"
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - minor
          - patch
      codeql-major:
        patterns:
          - "github/codeql-action/*"
        update-types:
          - major
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
