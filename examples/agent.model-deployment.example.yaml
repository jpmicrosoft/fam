# Prompt Agent manifest with an explicitly managed account model deployment.
#
# Replace every placeholder, then run:
#   foundry-agent-manager prompt validate -f examples/agent.model-deployment.example.yaml
#   foundry-agent-manager model deployment plan -f examples/agent.model-deployment.example.yaml
#   foundry-agent-manager model deployment create -f examples/agent.model-deployment.example.yaml
#   foundry-agent-manager prompt preflight -f examples/agent.model-deployment.example.yaml
#   foundry-agent-manager prompt deploy -f examples/agent.model-deployment.example.yaml --if-changed
#
# Model creation is never implicit in prompt deploy. The live model plan checks
# exact catalog availability, SKU capacity shape, quota, and regional capacity.

apiVersion: foundry-agent-manager/v1

agent:
  name: support-agent
  model: support-prod
  description: Prompt Agent backed by an explicitly managed model deployment.
  instructions: |
    Answer support questions clearly and identify missing information.

project:
  resource_id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/agents-rg/providers/Microsoft.CognitiveServices/accounts/sample-account/projects/support-project

model_deployment:
  deployment_name: support-prod
  model_name: gpt-5-mini
  model_version: "2025-08-07"
  model_format: OpenAI
  sku_name: GlobalStandard
  capacity: 10
  # Optional existing deployment-level dependencies:
  # rai_policy_name: Microsoft.DefaultV2
  # version_upgrade_option: OnceNewDefaultVersionAvailable
  # spillover_deployment_name: support-spillover

tools:
  - type: code_interpreter
